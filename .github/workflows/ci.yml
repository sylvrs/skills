name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Skills
        run: |
          for test_script in skills/*/tests/validate-skill.mjs; do
            if [ -f "$test_script" ]; then
              echo "==> Running $test_script..."
              node "$test_script"
            fi
          done
